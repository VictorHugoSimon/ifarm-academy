name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: academy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and Function contract tests
        run: npm test

      - name: Validate migrations
        run: python3 scripts/validate_migrations.py

      - name: Database integration fixtures
        run: python3 scripts/integration_db_contract.py

      - name: Enterprise integration fixtures
        run: python3 scripts/integration_enterprise_contract.py

      - name: Enterprise paths and renewals fixtures
        run: python3 scripts/integration_enterprise_paths_contract.py

      - name: Learning cycles migration and isolation fixtures
        run: python3 scripts/integration_learning_cycles_contract.py

      - name: Events and Smart Farm Experience fixtures
        run: python3 scripts/integration_events_contract.py

      - name: Instructor governance fixtures
        run: python3 scripts/integration_instructor_governance_contract.py

      - name: Reporting integration fixtures
        run: python3 scripts/integration_reports_contract.py

      - name: Certificate validity fixtures
        run: python3 scripts/integration_certificate_validity_contract.py

      - name: Operational hardening fixtures
        run: python3 scripts/integration_operational_hardening_contract.py

      - name: Smart Farm field experience fixtures
        run: python3 scripts/integration_smart_farm_experience_contract.py

      - name: Marketplace fixtures
        run: python3 scripts/integration_marketplace_contract.py

      - name: White label fixtures
        run: python3 scripts/integration_white_label_contract.py

      - name: Gamification fixtures
        run: python3 scripts/integration_gamification_contract.py

      - name: Notifications fixtures
        run: python3 scripts/integration_notifications_contract.py

      - name: Public portal fixtures
        run: python3 scripts/integration_public_portal_contract.py

      - name: Public paths and instructors fixtures
        run: python3 scripts/integration_public_discovery_contract.py

      - name: Plans and subscriptions fixtures
        run: python3 scripts/integration_plans_contract.py

      - name: Commercial engine and consent fixtures
        run: python3 scripts/integration_commercial_engine_contract.py

      - name: Commercial handoff and conversion fixtures
        run: python3 scripts/integration_commercial_handoff_contract.py

      - name: Commercial privacy and revocation fixtures
        run: python3 scripts/integration_commercial_consent_contract.py

      - name: Commercial delivery worker fixtures
        run: python3 scripts/integration_commercial_worker_contract.py

      - name: AI Tutor authorized content fixtures
        run: python3 scripts/integration_tutor_contract.py

      - name: AI Tutor provider boundary fixtures
        run: python3 scripts/integration_tutor_provider_contract.py

      - name: AI Tutor usage and guardrail fixtures
        run: python3 scripts/integration_tutor_guardrails_contract.py

      - name: STAGE readiness smoke contract
        run: python3 scripts/stage_readiness_contract.py

      - name: Deployment isolation contract
        run: python3 scripts/deployment_contract.py

      - name: Build
        run: npm run build

# Deploys ficam isolados em deploy-stage.yml e deploy-production.yml.
