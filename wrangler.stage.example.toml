name = "ifarm-academy-stage"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

# Exemplo de binding. Preencher somente após criar um D1 exclusivo da Academy STAGE.
# Nunca reutilizar database_id de outro projeto.
#
# [[d1_databases]]
# binding = "ACADEMY_DB"
# database_name = "ifarm-academy-stage"
# database_id = "<D1_DATABASE_ID_EXCLUSIVO_STAGE>"

# Storage exclusivo da Academy. O nome do bucket é exemplo e só deve ser
# ativado após provisionamento de um recurso exclusivo deste projeto.
#
# [[r2_buckets]]
# binding = "ACADEMY_STORAGE"
# bucket_name = "ifarm-academy-stage-materials"

[vars]
ACADEMY_ENVIRONMENT = "stage"
ACADEMY_RELEASE = "0.47.0"
ACADEMY_CORE_REQUEST_TIMEOUT_MS = "4000"
# Definir no ambiente STAGE com a URL real da API do iFarm Core STAGE:
# ACADEMY_CORE_API_URL = "https://<core-stage-api>"

# Secrets devem ser cadastrados no ambiente, nunca neste arquivo:
# - ACADEMY_ADMIN_PROXY_SECRET
#
# Variável pública de build do frontend, configurar no Pages STAGE:
# - VITE_NEON_AUTH_URL = URL Neon Auth do mesmo ambiente do iFarm Core
